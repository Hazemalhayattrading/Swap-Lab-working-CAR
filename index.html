<!doctype html>
<html lang="en" data-scene-state="loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0e10" />
    <meta
      name="description"
      content="Swap Lab: plan a drift car build in a virtual workshop. Swap engines, turbos and cooling, see it in 3D and in calibrated numbers."
    />
    <title>Swap Lab</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <main class="garage">
      <canvas
        id="viewport"
        class="viewport"
        role="application"
        aria-roledescription="3D view"
        tabindex="0"
        aria-label="3D view of the empty workshop bay. Drag or use the arrow keys to look around. Scroll, pinch, or press plus and minus to move closer or further."
      ></canvas>

      <header class="shop-tag" aria-label="Swap Lab">
        <span class="shop-tag__name">Swap Lab</span>
        <span class="shop-tag__bay">Bay 1</span>
      </header>

      <p class="tape-note" id="bay-note">Bay empty. No car on the lift yet.</p>

      <section class="telemetry" id="telemetry" aria-label="Render readouts and quality">
        <button
          class="telemetry__toggle"
          id="telemetry-toggle"
          type="button"
          aria-expanded="true"
          aria-controls="telemetry-body"
        >
          Hide panel
        </button>
        <div class="telemetry__body" id="telemetry-body">
          <dl class="readouts">
            <div class="readout">
              <dt>Renderer</dt>
              <dd id="readout-backend">Starting</dd>
            </div>
            <div class="readout">
              <dt>Frame</dt>
              <dd><span id="readout-frame">--.-</span> ms</dd>
            </div>
            <div class="readout">
              <dt>Rate</dt>
              <dd><span id="readout-fps">--</span> fps</dd>
            </div>
          </dl>
          <fieldset class="quality" id="quality">
            <legend>Quality</legend>
            <label><input type="radio" name="quality" value="low" /> <span>Low</span></label>
            <label><input type="radio" name="quality" value="high" /> <span>High</span></label>
            <label><input type="radio" name="quality" value="ultra" /> <span>Ultra</span></label>
          </fieldset>
        </div>
      </section>

      <div class="fault" id="fault" role="alert" hidden>
        <h1 class="fault__title" id="fault-title"></h1>
        <p class="fault__body" id="fault-body"></p>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
